name: Patch Vibe-Coding description
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.service-modal-copy p{font-size:18px;line-height:1.55;color:#aab9d5;margin:0}'
          new_css = old_css + '.service-modal-copy #serviceDescription .vibe-lead{display:block;color:#4d8dff;font-size:21px;line-height:1.4;font-weight:700;margin-bottom:26px}.service-modal-copy #serviceDescription .vibe-text{display:block}'
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)
          old_data = "vibe:{kicker:'VIBE-CODING',title:'Vibe-Coding',description:'Автоматизация, скрипты, боты и веб-решения превращают идеи в работающие инструменты.'}"
          new_data = "vibe:{kicker:'VIBE-CODING',title:'Вайб-кодинг',description:'<span class=\"vibe-lead\">Любая идея. Реальные результаты.</span><span class=\"vibe-text\">Вайб-кодинг — это современный подход к созданию решений с помощью искусственного интеллекта. Ты описываешь идею на обычном языке, а ИИ помогает превратить её в работающий результат.<br><br>Это может быть веб-сайт, приложение, скрипт, аналитика, презентация, текст, изображение или видео — возможности практически безграничны.<br><br>Главное — правильно поставить задачу. Я помогаю превратить идеи в реальные и полезные решения.</span>'}"
          if old_data not in s:
              raise SystemExit('Vibe data anchor not found')
          s = s.replace(old_data, new_data, 1)
          old_js = 'serviceDescription.textContent=data.description;'
          if old_js not in s:
              raise SystemExit('JS anchor not found')
          s = s.replace(old_js, 'serviceDescription.innerHTML=data.description;', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Vibe-Coding modal description"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/patch-vibe-description.yml || true
          git commit -m "Remove temporary description workflow" || true
          git push || true
