name: Fix Vibe-Coding binary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Vibe-Coding binary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode WebP
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('vibe-coding.webp')
          data = base64.b64decode(p.read_text(encoding='utf-8').strip())
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded file is not a valid WebP')
          p.write_bytes(data)
          print(f'Wrote {len(data)} bytes')
          PY
      - name: Commit binary and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vibe-coding.webp
          git rm .github/workflows/fix-vibe-binary.yml
          git commit -m 'Fix Vibe-Coding binary'
          git push
