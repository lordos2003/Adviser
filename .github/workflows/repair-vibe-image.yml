name: Repair Vibe image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Vibe visual from approved site visual
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          img = Image.open('site-visual.webp').convert('RGB')
          w, h = img.size
          left = int(w * 0.43)
          right = int(w * 0.70)
          crop = img.crop((left, 0, right, h))
          crop.save('vibe-coding.webp', 'WEBP', quality=82, method=6)
          print(f'source={w}x{h}, crop={crop.size}')
          PY
      - name: Commit real binary image and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vibe-coding.webp
          git rm .github/workflows/repair-vibe-image.yml
          git commit -m "Use real Vibe-Coding image"
          git push
