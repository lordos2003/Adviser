name: Add image lightbox
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add lightbox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="serviceLightbox"' in s:
              raise SystemExit('Lightbox already exists')
          css = '''\n.service-modal-image img{cursor:zoom-in}\n.service-lightbox{position:fixed;inset:0;z-index:9999;display:none;background:rgba(3,9,20,.96);overflow:auto;padding:24px}.service-lightbox.open{display:block}.service-lightbox-viewport{min-width:max-content;min-height:max-content;display:flex;align-items:flex-start;justify-content:flex-start}.service-lightbox img{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:initial;border-radius:0;box-shadow:none;background:transparent;cursor:zoom-out}.service-lightbox-close{position:fixed;top:18px;right:18px;z-index:10000;width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(20,30,48,.85);color:#fff;font-size:32px;line-height:1;cursor:pointer}.service-lightbox-close:hover{background:rgba(40,55,80,.95)}\n@media(max-width:700px){.service-lightbox{padding:12px}.service-lightbox-close{top:10px;right:10px;width:42px;height:42px;font-size:28px}}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          html = '''\n<div class="service-lightbox" id="serviceLightbox" aria-hidden="true">\n  <button class="service-lightbox-close" id="serviceLightboxClose" type="button" aria-label="Закрыть">×</button>\n  <div class="service-lightbox-viewport"><img id="serviceLightboxImage" alt=""></div>\n</div>\n<script>\n(()=>{\n  const lightbox=document.getElementById('serviceLightbox');\n  const lightboxImage=document.getElementById('serviceLightboxImage');\n  const closeButton=document.getElementById('serviceLightboxClose');\n  const openLightbox=img=>{\n    lightboxImage.src=img.currentSrc||img.src;\n    lightboxImage.alt=img.alt||'';\n    lightbox.classList.add('open');\n    lightbox.setAttribute('aria-hidden','false');\n    document.body.style.overflow='hidden';\n  };\n  const closeLightbox=()=>{\n    lightbox.classList.remove('open');\n    lightbox.setAttribute('aria-hidden','true');\n    lightboxImage.removeAttribute('src');\n    document.body.style.overflow='';\n  };\n  document.addEventListener('click',e=>{\n    const img=e.target.closest('.service-modal-image img');\n    if(img){e.preventDefault();e.stopPropagation();openLightbox(img);return;}\n    if(e.target===lightbox)closeLightbox();\n  });\n  closeButton.addEventListener('click',closeLightbox);\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();});\n})();\n</script>\n'''
          s = s.replace('</body>', html + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add full-screen image lightbox"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/add-lightbox.yml || true
          git commit -m "Remove temporary lightbox workflow" || true
          git push || true
