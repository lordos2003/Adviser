name: Try image morph transition

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lightbox transition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''.service-modal-image img{cursor:zoom-in}
.service-lightbox{position:fixed;inset:0;z-index:9999;display:none;background:rgba(3,9,20,.96);overflow:auto;padding:24px}.service-lightbox.open{display:block}.service-lightbox-viewport{min-width:max-content;min-height:max-content;display:flex;align-items:flex-start;justify-content:flex-start}.service-lightbox img{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:initial;border-radius:0;box-shadow:none;background:transparent;cursor:zoom-out}.service-lightbox-close{position:fixed;top:18px;right:18px;z-index:10000;width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(20,30,48,.85);color:#fff;font-size:32px;line-height:1;cursor:pointer}.service-lightbox-close:hover{background:rgba(40,55,80,.95)}
@media(max-width:700px){.service-lightbox{padding:12px}.service-lightbox-close{top:10px;right:10px;width:42px;height:42px;font-size:28px}}'''

          new_css = '''.service-modal-image img{cursor:zoom-in;view-transition-name:none}.service-lightbox{position:fixed;inset:0;z-index:9999;display:none;background:rgba(3,9,20,.96);overflow:auto;padding:24px}.service-lightbox.open{display:block}.service-lightbox-viewport{min-width:max-content;min-height:max-content;display:flex;align-items:flex-start;justify-content:flex-start}.service-lightbox img{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:initial;border-radius:0;box-shadow:none;background:transparent;cursor:zoom-out;view-transition-name:none}.service-lightbox-close{position:fixed;top:18px;right:18px;z-index:10000;width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(20,30,48,.85);color:#fff;font-size:32px;line-height:1;cursor:pointer}.service-lightbox-close:hover{background:rgba(40,55,80,.95)}::view-transition-group(service-image){animation-duration:520ms;animation-timing-function:cubic-bezier(.22,1,.36,1)}::view-transition-old(service-image),::view-transition-new(service-image){animation:none;mix-blend-mode:normal}.service-lightbox::before{content:'';position:fixed;inset:0;pointer-events:none}
@media(max-width:700px){.service-lightbox{padding:12px}.service-lightbox-close{top:10px;right:10px;width:42px;height:42px;font-size:28px}}'''

          if old_css not in text:
              raise SystemExit('Expected lightbox CSS block not found')
          text = text.replace(old_css, new_css, 1)

          old_js = '''(()=>{
  const lightbox=document.getElementById('serviceLightbox');
  const lightboxImage=document.getElementById('serviceLightboxImage');
  const closeButton=document.getElementById('serviceLightboxClose');
  let serviceWasOpen=false;
  const openLightbox=img=>{
    lightboxImage.src=img.currentSrc||img.src;
    lightboxImage.alt=img.alt||'';
    serviceWasOpen=serviceDialog.open;
    if(serviceWasOpen)serviceDialog.close();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  };
  const closeLightbox=()=>{
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightboxImage.removeAttribute('src');
    document.body.style.overflow='';
    if(serviceWasOpen){serviceWasOpen=false;serviceDialog.showModal();}
  };
  document.addEventListener('click',e=>{
    const img=e.target.closest('.service-modal-image img');
    if(img){e.preventDefault();e.stopPropagation();openLightbox(img);return;}
    if(e.target===lightbox)closeLightbox();
  });
  closeButton.addEventListener('click',closeLightbox);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();});
})();'''

          new_js = '''(()=>{
  const lightbox=document.getElementById('serviceLightbox');
  const lightboxImage=document.getElementById('serviceLightboxImage');
  const closeButton=document.getElementById('serviceLightboxClose');
  let activeSourceImage=null;
  const transition=update=>{
    if(document.startViewTransition)return document.startViewTransition(update);
    update();
    return {finished:Promise.resolve()};
  };
  const openLightbox=img=>{
    if(lightbox.classList.contains('open'))return;
    activeSourceImage=img;
    lightboxImage.src=img.currentSrc||img.src;
    lightboxImage.alt=img.alt||'';
    if(document.startViewTransition){
      img.style.viewTransitionName='service-image';
      const vt=transition(()=>{
        img.style.viewTransitionName='none';
        serviceDialog.close();
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
        lightboxImage.style.viewTransitionName='service-image';
        document.body.style.overflow='hidden';
      });
      vt.finished.finally(()=>{img.style.viewTransitionName='';});
    }else{
      serviceDialog.close();
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
    }
  };
  const closeLightbox=()=>{
    if(!lightbox.classList.contains('open'))return;
    const source=activeSourceImage;
    if(document.startViewTransition&&source){
      lightboxImage.style.viewTransitionName='service-image';
      const vt=transition(()=>{
        lightboxImage.style.viewTransitionName='none';
        source.style.viewTransitionName='service-image';
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden','true');
        serviceDialog.showModal();
        document.body.style.overflow='';
      });
      vt.finished.finally(()=>{
        source.style.viewTransitionName='';
        lightboxImage.removeAttribute('src');
        activeSourceImage=null;
      });
    }else{
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden','true');
      lightboxImage.removeAttribute('src');
      document.body.style.overflow='';
      if(source)source.style.viewTransitionName='';
      activeSourceImage=null;
      serviceDialog.showModal();
    }
  };
  document.addEventListener('click',e=>{
    const img=e.target.closest('.service-modal-image img');
    if(img){e.preventDefault();e.stopPropagation();openLightbox(img);return;}
    if(e.target===lightbox)closeLightbox();
  });
  closeButton.addEventListener('click',closeLightbox);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox();});
})();'''

          if old_js not in text:
              raise SystemExit('Expected lightbox JS block not found')
          text = text.replace(old_js, new_js, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add morph transition for service images"
          git rm .github/workflows/try-image-morph.yml
          git commit -m "Remove temporary image transition workflow"
          git push
